[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api"
version = "1.0.0"
description = "Python API service for the all-manifests dev stack"
requires-python = ">=3.8"

[project.scripts]
api-serve = "serve:main"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "test_*.py"
