# MinIO provides an S3-compatible object store for the remote cache. The
# createbucket service waits for MinIO to accept connections and then creates
# the `gaffer-cache` bucket idempotently.
#
#   docker compose up -d
#   docker compose down -v
#
# S3 API:    http://localhost:9000
# Web console: http://localhost:9001  (minioadmin / minioadmin)

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: gaffer-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  createbucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set gaffer http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          echo "waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing gaffer/gaffer-cache
        echo "bucket gaffer-cache ready"

volumes:
  minio-data:
